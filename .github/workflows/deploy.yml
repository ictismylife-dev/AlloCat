name: Deploy AlloCat to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Normalize package.json for public npm & build production bundle
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.dependencies = {
              "lucide-react": "^0.475.0",
              "react": "^19.0.0",
              "react-dom": "^19.0.0"
            };
            pkg.devDependencies = {
              "@tailwindcss/vite": "^4.0.9",
              "@types/node": "^22.10.0",
              "@types/react": "^19.0.0",
              "@types/react-dom": "^19.0.0",
              "@vitejs/plugin-react": "^4.3.4",
              "tailwindcss": "^4.0.9",
              "typescript": "^5.7.3",
              "vite": "^6.2.0"
            };
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '
          npm install --no-audit --no-fund
          npm run build
          mkdir -p docs/assets
          cp -r dist/assets/* docs/assets/
          touch docs/.nojekyll .nojekyll

      - name: Commit compiled assets to docs/ for Branch Deployment
        continue-on-error: true
        run: |
          git checkout package.json package-lock.json 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ .nojekyll
          if ! git diff --staged --quiet; then
            git commit -m "chore: update compiled bundle in docs/ [skip ci]"
            git push
          fi
