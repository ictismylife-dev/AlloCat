    <script id="gh-pages-root-fallback">
      window.addEventListener('DOMContentLoaded', async function () {
        var isViteDev = Boolean(document.querySelector('script[src*="@vite/client"]'));
        if (isViteDev) return;

        var pathname = window.location.pathname || '/';
        var basePrefix = pathname.indexOf('/AlloCat') === 0 ? '/AlloCat/' : './';
        var cacheBust = Date.now();

        try {
          var check = await fetch(basePrefix + 'docs/assets/app.js?v=' + cacheBust, { cache: 'no-store' });
          var contentType = check.headers.get('content-type') || '';
          if (check.ok && !contentType.includes('text/html')) {
            var jsCode = await check.text();
            if (jsCode.includes('Reporting & Capacity Analytics')) {
              var link = document.createElement('link');
              link.rel = 'stylesheet';
              link.href = basePrefix + 'docs/assets/app.css?v=' + cacheBust;
              document.head.appendChild(link);

              var blob = new Blob([jsCode], { type: 'text/javascript' });
              var script = document.createElement('script');
              script.type = 'module';
              script.src = URL.createObjectURL(blob);
              document.body.appendChild(script);
              return;
            }
          }
        } catch (_) {}

        var twStyle = document.createElement('style');
        twStyle.setAttribute('type', 'text/tailwindcss');
        twStyle.textContent = '@import "tailwindcss";\n@custom-variant dark (&:where(.dark, .dark *));';
        document.head.appendChild(twStyle);

        var loadScript = function (src) {
          return new Promise(function (resolve, reject) {
            var s = document.createElement('script');
            s.src = src;
            s.onload = resolve;
            s.onerror = reject;
            document.head.appendChild(s);
          });
        };

        var importEsModule = new Function('spec', 'return import(spec)');

        var results = await Promise.all([
          importEsModule('react'),
          importEsModule('react/jsx-runtime'),
          importEsModule('react-dom/client'),
          importEsModule('lucide-react'),
          loadScript('https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4'),
          loadScript('https://unpkg.com/@babel/standalone@7.26.9/babel.min.js')
        ]);

        var wrapEsModule = function (mod) {
          var base = Object.assign({}, mod && mod.default ? mod.default : {}, mod);
          Object.defineProperty(base, '__esModule', { value: true });
          if (!base.default) base.default = base;
          return base;
        };

        var externalModules = {
          'react': wrapEsModule(results[0]),
          'react/jsx-runtime': wrapEsModule(results[1]),
          'react-dom': wrapEsModule(results[2]),
          'react-dom/client': wrapEsModule(results[2]),
          'lucide-react': wrapEsModule(results[3]),
          'virtual:pwa-register': {
            __esModule: true,
            registerSW: function () { return function () {}; }
          }
        };

        var moduleOrder = [
          'types/index.ts',
          'utils/allocationMath.ts',
          'data/seedData.ts',
          'utils/importExportUtils.ts',
          'utils/usePWAInstall.ts',
          'components/LoginOverlay.tsx',
          'components/CommentCell.tsx',
          'components/CellAllocationPopover.tsx',
          'components/AdminPanelModal.tsx',
          'components/ReportingModal.tsx',
          'components/StandaloneAppModal.tsx',
          'components/Header.tsx',
          'components/Toolbar.tsx',
          'components/PeopleMatrixView.tsx',
          'components/ClientProjectMatrixView.tsx',
          'components/AvailabilityMatrixView.tsx',
          'components/BenchMatrixView.tsx',
          'components/AddLeaveModal.tsx',
          'components/AddPersonModal.tsx',
          'components/AddClientProjectModal.tsx',
          'components/BatchAssignModal.tsx',
          'components/ConfirmDeletePersonModal.tsx',
          'components/ManageDepartmentsModal.tsx',
          'components/ManageYearsModal.tsx',
          'components/OvertimeAlertsDrawer.tsx',
          'components/ExportImportModal.tsx',
          'App.tsx',
          'main.tsx'
        ];

        var baseCandidates = [
          basePrefix + 'src/',
          './src/',
          'https://raw.githubusercontent.com/ictismylife-dev/AlloCat/main/src/',
          'https://raw.githubusercontent.com/ictismylife-dev/AlloCat/master/src/'
        ];

        async function fetchSource(relPath) {
          for (var i = 0; i < baseCandidates.length; i++) {
            try {
              var res = await fetch(baseCandidates[i] + relPath + '?v=' + cacheBust, { cache: 'no-store' });
              if (res.ok) {
                var txt = await res.text();
                if (!txt.trim().startsWith('<!doctype') && !txt.trim().startsWith('<!DOCTYPE')) {
                  return txt;
                }
              }
            } catch (_) {}
          }
          throw new Error('Could not load ' + relPath);
        }

        var rawSources = {};
        await Promise.all(
          moduleOrder.map(async function (modPath) {
            rawSources[modPath] = await fetchSource(modPath);
          })
        );

        var compiledRegistry = {};
        var evaluatedExports = {};

        function resolveKey(fromModule, importSpec) {
          var fromParts = fromModule.split('/');
          fromParts.pop();
          var specParts = importSpec.split('/');
          for (var i = 0; i < specParts.length; i++) {
            var part = specParts[i];
            if (part === '.' || part === '') continue;
            if (part === '..') fromParts.pop();
            else fromParts.push(part);
          }
          var joined = fromParts.join('/');
          var candidates = [
            joined,
            joined + '.ts',
            joined + '.tsx',
            joined + '/index.ts',
            joined + '/index.tsx'
          ];
          return candidates.find(function (c) { return Boolean(compiledRegistry[c]); }) || null;
        }

        for (var j = 0; j < moduleOrder.length; j++) {
          var modPath = moduleOrder[j];
          compiledRegistry[modPath] = window.Babel.transform(rawSources[modPath], {
            filename: modPath,
            presets: [
              ['typescript', { isTSX: true, allExtensions: true }],
              ['react', { runtime: 'automatic' }]
            ],
            plugins: ['transform-modules-commonjs']
          }).code;
        }

        function evaluateModule(modPath) {
          if (evaluatedExports[modPath]) return evaluatedExports[modPath];
          var exportsObj = {};
          var moduleObj = { exports: exportsObj };
          evaluatedExports[modPath] = exportsObj;

          var customRequire = function (spec) {
            if (spec.endsWith('.css')) return {};
            if (externalModules[spec]) return externalModules[spec];
            if (spec.startsWith('.')) {
              var targetKey = resolveKey(modPath, spec);
              if (!targetKey) throw new Error('Cannot resolve ' + spec + ' from ' + modPath);
              return evaluateModule(targetKey);
            }
            throw new Error('Unknown external import: ' + spec);
          };

          var fn = new Function('exports', 'require', 'module', compiledRegistry[modPath]);
          fn(exportsObj, customRequire, moduleObj);
          evaluatedExports[modPath] = moduleObj.exports;
          return moduleObj.exports;
        }

        evaluateModule('main.tsx');
      });
    </script>
